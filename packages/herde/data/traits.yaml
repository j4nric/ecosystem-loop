# Erfahrungen und Merkmale der Herde (Konzept 9.1). Zahlen sind Platzhalter (Logik vor Balancing).
#
# offerSize     so viele verfügbare Merkmale bietet die Engine zu Beginn einer Jahreszeit höchstens an: zuerst die
#               aus mature.oneOf der aktuellen Stufe (stages.yaml), dann die übrigen, je in der Reihenfolge dieser
#               Datei. Der Spieler wählt eines oder lässt das Angebot stehen; ein liegen gebliebenes Angebot rotiert
#               zur nächsten Jahreszeit weiter (ohne Zufall), damit andere verfügbare Merkmale drankommen
#
# experiences   Zähler des Erlebten, je Monat geprüft (nach Fressen, Durst, Kälte und Wölfen, nur wenn die Herde
#               lebt). when.type:
#                 sheltered  Schutz in der Nähe in einer Jahreszeit, in der die Stufe Schutz braucht (+1)
#                 watered    Wasser in der Nähe in einer Jahreszeit, in der die Stufe Wasser braucht (+1)
#                 hunted     Wölfe haben gerissen, die Herde lebt (+1)
#                 fire       ein Waldbrand hat das Feld der Herde oder ein Nachbarfeld erfasst (+1); Feuer durch
#                            die Blitz-Karte zählt nicht (sonst ließe sich das Merkmal mit der eigenen Karte farmen)
#                 ate        die Herde steht auf einer der Landschaften `lands` und hat gefressen (+1); großzügig:
#                            woher das Futter im Umkreis kam, wird nicht geprüft
#                 on         die Herde steht auf einer der Landschaften `lands` (+1)
#                 moved      gegangene Felder in Luftlinie zwischen Start und Ziel des Monats (+ Zahl der Felder)
#                 prey       Wild im Umkreis reach (der Stufe) um die Herde (+1)
#                 burnt      frische Brandfläche (params fire.fresh) im Umkreis reach und kein Verlust durch Feuer in
#                            diesem Monat (+1); anders als fire zählt auch der Blitz (Feuer als Werkzeug)
#
# traits        Merkmale: verfügbar, sobald die Erfahrung `from` den Wert `at` erreicht. effects ändern Zahlen der
#               Stufe (stages.yaml): Wert × mul + add. Die Wirkungen werden in der Reihenfolge angewandt, in der
#               die Herde die Merkmale gewählt hat (nicht in der Reihenfolge dieser Datei). Ganzzahlige Werte (move,
#               reach, trail, thirstAfter, wolfGuard) werden gerundet. Die Wirkung bleibt über den Stufensprung; für
#               die Reife zählen je nach mature.scope nur Merkmale der aktuellen Stufe.
offerSize: 3
experiences:
  - id: sheltered
    name: { de: Kalte Monate im Schutz, en: Cold months in shelter }
    when: { type: sheltered }
  - id: hunted
    name: { de: Wolfsangriffe überlebt, en: Wolf attacks survived }
    when: { type: hunted }
  - id: watered
    name: { de: Durstige Monate am Wasser, en: Thirsty months by water }
    when: { type: watered }
  - id: fire
    name: { de: Waldbrände überlebt, en: Wildfires survived }
    when: { type: fire }
  - id: forest
    name: { de: Monate im Gehölz gefressen, en: Months feeding in the woods }
    when: { type: ate, lands: [bush, forest, old] }
  - id: open
    name: { de: Monate auf offener Fläche, en: Months in open land }
    when: { type: on, lands: [steppe, meadow, burnt] }
  - id: walked
    name: { de: Gegangene Felder, en: Fields walked }
    when: { type: moved }
  - id: tracks
    name: { de: Monate nahe Wild, en: Months near game }
    when: { type: prey }
  - id: fire_tamed
    name: { de: Feuer ohne Verlust überstanden, en: Fires weathered unharmed }
    when: { type: burnt }
traits:
  - id: thick_fur
    name: { de: Dichtes Fell, en: Thick fur }
    text: { de: Halber Verlust durch Kälte., en: Half the losses to cold. }
    icon: '🧥'
    from: sheltered
    at: 3
    effects: [{ stat: coldLoss, mul: 0.5 }]
  - id: vigilant
    name: { de: Wachsamkeit, en: Vigilance }
    text: { de: Jedes Rudel reißt ein Tier weniger., en: Each pack kills one animal less. }
    icon: '👁'
    from: hunted
    at: 2
    effects: [{ stat: wolfGuard, add: 1 }]
  - id: frugal
    name: { de: Genügsam, en: Frugal }
    text: { de: Durst setzt einen Monat später ein., en: Thirst sets in a month later. }
    icon: '💧'
    from: watered
    at: 4
    effects: [{ stat: thirstAfter, add: 1 }]
  - id: fire_wary
    name: { de: Feuerscheu, en: Fire-wary }
    text: { de: Halber Verlust durch Feuer., en: Half the losses to fire. }
    icon: '🔥'
    from: fire
    at: 1
    effects: [{ stat: fireLoss, mul: 0.5 }]
  - id: forest_wise
    name: { de: Waldkundig, en: Forest-wise }
    text: { de: Größerer Vorrat., en: Larger reserves. }
    icon: '🌲'
    from: forest
    at: 4
    effects: [{ stat: fatCap, add: 1 }]
  - id: far_sight
    name: { de: Weitblick, en: Far sight }
    text: { de: Halber Verlust durch Durst., en: Half the losses to thirst. }
    icon: '🔭'
    from: open
    at: 6
    effects: [{ stat: thirstLoss, mul: 0.5 }]
  - id: endurance
    name: { de: Ausdauer, en: Endurance }
    text: { de: Halb so viele Hungertote., en: Half as many deaths from hunger. }
    icon: '🦶'
    from: walked
    at: 12
    effects: [{ stat: starveRate, mul: 0.5 }]
  - id: tracker
    name: { de: Spurenleser, en: Tracker }
    text: { de: Die Jagd bringt ein Tier mehr., en: The hunt yields one more animal. }
    icon: '🐾'
    from: tracks
    at: 4
    effects: [{ stat: huntKill, add: 1 }]
  - id: fire_keeper
    name: { de: Feuerhüter, en: Fire keeper }
    text: { de: Jagd im Feuer bringt ein Tier mehr., en: Hunting with fire yields one more animal. }
    icon: '🪔'
    from: fire_tamed
    at: 1
    effects: [{ stat: fireHunt, add: 1 }]
  - id: weathered
    name: { de: Wetterfest, en: Weathered }
    text: { de: Noch einmal halber Verlust durch Kälte., en: Half the losses to cold once more. }
    icon: '🌨'
    from: sheltered
    at: 12
    effects: [{ stat: coldLoss, mul: 0.5 }]
  - id: seasoned_hunter
    name: { de: Erfahrene Jäger, en: Seasoned hunters }
    text: { de: Jedes erlegte Tier bringt mehr Futter., en: Each animal hunted yields more food. }
    icon: '🏹'
    from: tracks
    at: 12
    effects: [{ stat: preyFood, add: 1 }]
