# Harmonie (Konzept 7): Lebenszeichen der Welt, 0–max. Bei collapseAt kollabiert sie, die Partie endet.

start: 60
max: 100
collapseAt: 0

perRound:
  # je Zone nach Art ihrer Form
  formKind: { ideal: 2, normal: 0, degraded: -3, disturbance: 0 }
  # je Zone mit Störung in dieser Runde (AUSLEGUNG: „Harmonie-Einbruch“ aus Konzept 8, Zahl ist Platzhalter)
  disturbance: -2
  # ab Phase 2 (Arten)
  perSpecies: 0.5
  extinction: -10
  hungerPerZone: -1
  perHuman: -0.5
