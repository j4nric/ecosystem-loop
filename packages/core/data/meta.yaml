# Meta-Progression (Konzept 10): Schöpfungsbuch und Kartenpool für Startdecks (8–10 Karten).
# Pool = basePool + Gaben entdeckter Arten (species.yaml → gift) + Freischaltungen erreichter Meilensteine.
# „Progression bedeutet früheren Zugang zu Werkzeugen, nicht mehr Macht.“ Alle Schwellen sind Platzhalter.
#
# Kennzahlen für when (Wert ≥ gte): games, discovered (entdeckte Arten), extinctions, events (eingetretene
# Ereignisse), rounds (Summe), bestScore, bestRounds, bestTier.

basePool:
  [
    thunderstorm,
    drought,
    storm,
    frost,
    rain,
    dry_wind,
    sun,
    shade,
    seeds,
    fertilizer,
    snowfall,
    spring_water,
    low_tide,
    leaf_fall,
    healing,
    balance,
  ]

milestones:
  - id: first_extinction
    name: { de: Erstes Aussterben, en: First extinction }
    description: { de: 'Eine Art ist zum ersten Mal ausgestorben.', en: 'A species died out for the first time.' }
    when: [{ stat: extinctions, gte: 1 }]
    unlocks: [ark]

  - id: weathered
    name: { de: Wetterfest, en: Weathered }
    description: { de: '5 Ereignisse überstanden.', en: 'Weathered 5 events.' }
    when: [{ stat: events, gte: 5 }]
    unlocks: [silence]

  - id: first_year
    name: { de: Das erste Jahr, en: The first year }
    description: { de: 'Eine Welt hat ein ganzes Jahr überdauert.', en: 'A world lasted a whole year.' }
    when: [{ stat: bestRounds, gte: 4 }]
    unlocks: [inspiration]

  - id: higher_life
    name: { de: Höheres Leben, en: Higher life }
    description: { de: 'Leben der Stufe 4 ist entstanden.', en: 'Life of tier 4 has emerged.' }
    when: [{ stat: bestTier, gte: 4 }]
    unlocks: [blessing]
