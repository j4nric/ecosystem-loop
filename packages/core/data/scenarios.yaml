# Startwelten. adjust verschiebt einen Wert in allen Zonen, die ihn haben; zones überschreibt einzelne Zonen.
# harmony/breath überschreiben die Startwerte aus harmony.yaml bzw. config.yaml.
# populations: Startleben je Zone (Konzept 5.3: Plankton im Wasser, Käfer an Land).

scenarios:
  - id: standard
    name: { de: Ruhende Insel, en: Resting island }
    description:
      de: 'Alle Zonen in ihrem natürlichen Zustand.'
      en: 'Every zone in its natural state.'
    populations: &start_life
      river: { plankton: 3 }
      coast: { plankton: 3 }
      forest: { beetle: 3 }
      plains: { beetle: 3 }

  - id: drought
    name: { de: Dürrejahr, en: Year of drought }
    description:
      de: 'Die Insel ist ausgetrocknet, der Fluss führt kaum Wasser.'
      en: 'The island is parched and the river runs low.'
    adjust: { moisture: -2 }
    zones:
      river: { stats: { water: 1 } }
      mountains: { stats: { snow: 1 } }
    populations: *start_life

  - id: wet
    name: { de: Regenzeit, en: Rainy season }
    description:
      de: 'Alles ist nass, der Fluss steht hoch.'
      en: 'Everything is wet and the river runs high.'
    adjust: { moisture: 1, light: -1 }
    zones:
      river: { stats: { water: 4 } }
    populations: *start_life

  - id: fragile
    name: { de: Zerbrechliche Welt, en: Fragile world }
    description:
      de: 'Weniger Harmonie und Odem zu Beginn, der Wald ist abgebrannt.'
      en: 'Less harmony and breath at the start; the forest has burnt down.'
    harmony: 40
    breath: 2
    zones:
      forest: { stats: { vegetation: 1, deadwood: 4 } }
    populations: *start_life
