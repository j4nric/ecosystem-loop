# Die Insel (Konzept 4): fünf Zonen mit fester Geografie und ihre Nachbarschaft.
# start: Startwerte (fehlende = Ruhewert der Geografie), level: Startstufe.
#
#           Berge
#         /       \
#      Wald ─── Fluss
#         \     /    \
#       Flachland ── Küste

zones:
  - { id: mountains, geography: mountains, neighbors: [forest, river] }
  - { id: forest, geography: forest, neighbors: [mountains, river, plains] }
  - { id: plains, geography: plains, neighbors: [forest, river, coast] }
  - { id: river, geography: river, neighbors: [mountains, forest, plains, coast] }
  - { id: coast, geography: coast, neighbors: [river, plains] }
