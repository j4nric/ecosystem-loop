# Werte und Geografien (Konzept 4.1, 4.2). Alle Zahlen sind Platzhalter (Logik vor Balancing).
#
# stats       – alle Werte der Insel (Skala in config.yaml → scale)
# common      – Werte, die jede Zone hat; dazu kommt der Sonderwert ihrer Geografie
# geographies – je Geografie: Sonderwert, Ruhewerte (Ziel der Selbstheilung) und Formen.
#   Formen: die erste passende gilt; die letzte hat keine Bedingungen („sonst“).
#   kind: ideal | normal | degraded (verödet) | disturbance (Störung)

stats:
  - { id: light, short: L, name: { de: Licht, en: Light } }
  - { id: moisture, short: F, name: { de: Feuchte, en: Moisture } }
  - { id: vegetation, short: V, name: { de: Vegetation, en: Vegetation } }
  - { id: snow, short: S, name: { de: Schnee, en: Snow } }
  - { id: deadwood, short: T, name: { de: Totholz, en: Deadwood } }
  - { id: soil, short: B, name: { de: Boden, en: Soil } }
  - { id: water, short: W, name: { de: Wasserstand, en: Water level } }
  - { id: salt, short: Sa, name: { de: Salz, en: Salt } }

common: [light, moisture, vegetation]

geographies:
  - id: mountains
    name: { de: Berge, en: Mountains }
    special: snow
    rest: { light: 4, moisture: 2, vegetation: 1, snow: 3 }
    forms:
      - id: glacier
        name: { de: Gletscher, en: Glacier }
        kind: normal
        when: [{ stat: snow, eq: 5 }]
      - id: scree
        name: { de: Geröll, en: Scree }
        kind: degraded
        when: [{ stat: vegetation, eq: 0 }, { stat: snow, lte: 1 }]
      - id: alpine_meadow
        name: { de: Alm, en: Alpine meadow }
        kind: ideal
        when: [{ stat: vegetation, gte: 2, lte: 3 }, { stat: snow, gte: 1, lte: 2 }, { stat: light, gte: 3 }]
      - id: mountain_forest
        name: { de: Bergwald, en: Mountain forest }
        kind: normal
        when: [{ stat: vegetation, gte: 4 }]
      - id: rock
        name: { de: Fels, en: Rock }
        kind: normal

  - id: forest
    name: { de: Wald, en: Forest }
    special: deadwood
    rest: { light: 2, moisture: 3, vegetation: 4, deadwood: 2 }
    forms:
      - id: burnt_land
        name: { de: Brandfläche, en: Burnt land }
        kind: degraded
        when: [{ stat: vegetation, lte: 1 }, { stat: deadwood, gte: 3 }]
      - id: dry_forest
        name: { de: Trockenwald, en: Dry forest }
        kind: normal
        when: [{ stat: moisture, lte: 1 }, { stat: vegetation, gte: 3 }]
      - id: primeval_forest
        name: { de: Urwald, en: Primeval forest }
        kind: ideal
        when: [{ stat: vegetation, gte: 4 }, { stat: moisture, gte: 4 }, { stat: deadwood, gte: 2, lte: 3 }]
      - id: open_forest
        name: { de: Lichter Wald, en: Open woodland }
        kind: normal
        when: [{ stat: light, gte: 3 }, { stat: vegetation, gte: 2, lte: 3 }]
      - id: mixed_forest
        name: { de: Mischwald, en: Mixed forest }
        kind: normal

  - id: plains
    name: { de: Flachland, en: Plains }
    special: soil
    rest: { light: 4, moisture: 3, vegetation: 3, soil: 3 }
    forms:
      - id: wasteland
        name: { de: Ödland, en: Wasteland }
        kind: degraded
        when: [{ stat: vegetation, eq: 0 }, { stat: moisture, lte: 1 }]
      - id: bog
        name: { de: Moor, en: Bog }
        kind: normal
        when: [{ stat: moisture, gte: 4 }]
      - id: flower_meadow
        name: { de: Blumenwiese, en: Flower meadow }
        kind: ideal
        when:
          [
            { stat: vegetation, gte: 2, lte: 4 },
            { stat: soil, gte: 4 },
            { stat: light, gte: 3 },
            { stat: moisture, lte: 3 },
          ]
      - id: steppe
        name: { de: Steppe, en: Steppe }
        kind: normal
        when: [{ stat: moisture, lte: 2 }]
      - id: shrubland
        name: { de: Buschland, en: Shrubland }
        kind: normal
        when: [{ stat: vegetation, eq: 5 }]
      - id: meadow
        name: { de: Wiese, en: Meadow }
        kind: normal

  - id: river
    name: { de: Fluss, en: River }
    special: water
    rest: { light: 3, moisture: 5, vegetation: 2, water: 3 }
    forms:
      - id: dry_riverbed
        name: { de: Trockenes Flussbett, en: Dry riverbed }
        kind: degraded
        when: [{ stat: water, eq: 0 }]
      - id: flood
        name: { de: Hochwasser, en: Flood }
        kind: disturbance
        when: [{ stat: water, eq: 5 }]
      - id: brook
        name: { de: Bach, en: Brook }
        kind: normal
        when: [{ stat: water, gte: 1, lte: 2 }]
      - id: floodplain
        name: { de: Aue, en: Floodplain }
        kind: ideal
        when: [{ stat: water, eq: 3 }, { stat: vegetation, gte: 3 }]
      - id: stream
        name: { de: Strom, en: Stream }
        kind: normal

  - id: coast
    name: { de: Küste, en: Coast }
    special: salt
    rest: { light: 4, moisture: 3, vegetation: 1, salt: 3 }
    forms:
      - id: salt_flat
        name: { de: Salzwüste, en: Salt flat }
        kind: degraded
        when: [{ stat: salt, eq: 5 }, { stat: moisture, lte: 2 }]
      - id: mangrove
        name: { de: Mangrove, en: Mangrove }
        kind: ideal
        when: [{ stat: vegetation, gte: 3 }, { stat: salt, gte: 2, lte: 3 }, { stat: moisture, gte: 4 }]
      - id: reef
        name: { de: Riff, en: Reef }
        kind: normal
        when: [{ stat: light, gte: 4 }, { stat: salt, gte: 3 }]
      - id: mudflat
        name: { de: Watt, en: Mudflat }
        kind: normal
        when: [{ stat: moisture, gte: 4 }, { stat: vegetation, lte: 2 }]
      - id: beach
        name: { de: Strand, en: Beach }
        kind: normal
