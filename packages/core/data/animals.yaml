# Steckbriefe. Bedingungen beziehen sich auf die Zone, in die das Tier einzieht.
#
# Bedingungen: { stat, gte|lte|eq } · { animal } · { noAnimal } · { tag } · { noTag } ·
# { zoneType } · { anyNeighbor: [...] } · { cardPlayed, gte } · { calmTurns } ·
# { hasAnimals } · { not: [...] } · { any: [...] }

animals:
  - id: beetle
    name: { de: Käfer }
    tier: 1
    groups: [insect]
    conditions:
      - { stat: deadwood, gte: 2 }
    card: decomposition

  - id: butterfly
    name: { de: Schmetterling }
    tier: 1
    groups: [insect]
    conditions:
      - { stat: light, gte: 3 }
      - { stat: density, lte: 2 }
    card: pollination

  - id: frog
    name: { de: Frosch }
    tier: 1
    groups: [amphibian]
    conditions:
      - { stat: moisture, gte: 4 }
    card: mist

  - id: woodpecker
    name: { de: Specht }
    tier: 2
    groups: [bird]
    conditions:
      - { animal: beetle }
      - { stat: density, gte: 3 }
    card: tree_hollow
    eats: [beetle]

  - id: hummingbird
    name: { de: Kolibri }
    tier: 2
    groups: [bird]
    conditions:
      - { animal: butterfly }
      - { anyNeighbor: [{ stat: density, gte: 3 }] }
    card: long_flight

  - id: snake
    name: { de: Schlange }
    tier: 2
    groups: [reptile]
    conditions:
      - { animal: frog }
      - { stat: light, gte: 2 }
    card: shy
    eats: [frog]

  - id: capybara
    name: { de: Wasserschwein }
    tier: 3
    groups: [mammal]
    conditions:
      - { stat: moisture, gte: 3 }
      - { stat: light, gte: 3 }
      - { stat: density, lte: 2 }
      - { noAnimal: snake }
    card: trail

  - id: parrot
    name: { de: Papagei }
    tier: 3
    groups: [bird]
    conditions:
      - { tag: nest }
      - { stat: density, gte: 4 }
      - { cardPlayed: pollination, gte: 2 }
    card: fruit_rain

  - id: jaguar
    name: { de: Jaguar }
    tier: 4
    groups: [mammal]
    conditions:
      - { animal: capybara }
      - { anyNeighbor: [{ stat: density, gte: 4 }] }
      - { calmTurns: 3 }
    card: carrion
    eats: [capybara]

  - id: harpy
    name: { de: Harpyie }
    tier: 4
    groups: [bird]
    conditions:
      - { animal: parrot }
      - { stat: density, eq: 5 }
      - { tag: nest }
    card: aerie
    eats: [parrot]
