  effect.disturb: { de: 'Störung', en: 'disturbance' }
  effect.setLevel: { de: 'Zonenstufe auf {n}', en: 'zone level to {n}' }
  effect.eventCancel: { de: 'nächstes Ereignis entfällt', en: 'the next event does not happen' }
  effect.eventDelay: { de: 'nächstes Ereignis {n} Runde später', en: 'next event {n} round later' }
