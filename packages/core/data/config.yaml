  cond.lte: { de: '{stat} ≤ {n}', en: '{stat} ≤ {n}' }
  cond.eq: { de: '{stat} = {n}', en: '{stat} = {n}' }
  cond.range: { de: '{stat} {a}–{b}', en: '{stat} {a}–{b}' }
  cond.hasStat: { de: 'Zone mit {stat}', en: 'zone with {stat}' }
  cond.geography: { de: '{geo}', en: '{geo}' }
  cond.form: { de: 'Form {form}', en: 'form {form}' }
  cond.formKind: { de: 'Form {kind}', en: '{kind} form' }
  cond.season: { de: 'im {season}', en: 'in {season}' }
  cond.disturbedWithin: { de: 'Störung in den letzten {n} Runden', en: 'disturbed within the last {n} rounds' }
  cond.minLevel: { de: 'Zonenstufe ≥ {n}', en: 'zone level ≥ {n}' }
  cond.anyNeighbor: { de: 'ein Nachbar mit {conds}', en: 'a neighbour with {conds}' }
