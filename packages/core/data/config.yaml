  join.and: { de: ' und ', en: ' and ' }
  join.or: { de: ' oder ', en: ' or ' }
  # Kartentext: Sätze (Wirkungen, Wahl, Schwellen, Bedingung als Zusatz)
  join.list: { de: ' ', en: ' ' }
  join.effects: { de: ', ', en: ', ' }
  join.req: { de: ', ', en: ', ' }
  sentence: { de: '{text}.', en: '{text}.' }
  trigger: { de: '{icon} {name} bei {conds}: {effects}', en: '{icon} {name} if {conds}: {effects}' }
  trigger.always: { de: '{icon} {name}: {effects}', en: '{icon} {name}: {effects}' }
  trigger.disturbance: { de: '{text} (Störung)', en: '{text} (disturbance)' }
  at.neighbor: { de: '{text} nebenan', en: '{text} next door' }
  # Bedingung eines Ziels: „Nur auf Fluss oder Küste“, „Nur wo Fisch lebt, neben Fluss“
  req: { de: 'Nur {req}', en: 'Only {req}' }
  req.on: { de: 'auf {geos}', en: 'on {geos}' }
  req.where: { de: 'wo {conds}', en: 'where {conds}' }
