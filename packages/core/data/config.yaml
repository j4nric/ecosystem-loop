# Globale Regelparameter der Engine v2. Alles hier ist Balancing bzw. Daten – Änderungen brauchen keinen Code.

scale: { min: 0, max: 5 } # Skala aller Zonenwerte

turn:
  handSize: 4 # nach jeder Runde wird auf 4 nachgezogen; ist der Stapel leer, wird die Ablage gemischt
  minPlays: 1 # Kartenzwang (greift nur, wenn eine bezahlbare Karte spielbar ist)
  maxPlays: null # null = beliebig viele

deck: { minSize: 8, maxSize: 10, maxCopies: 2 } # Startdeck 8–10 Karten, höchstens 2 Kopien je Karte (Konzept 10)

# Variierende Startwelten (Konzept 10): jeder Startwert streut aus dem Seed um ±spread. vary: Standard für newGame.
startWorld: { vary: false, spread: 1 }

# Natur-Phase und Bilanz in fester Reihenfolge (Konzept 3). Module: src/rules/.
# AUSLEGUNG: score vor harmony – auch die Runde des Kollapses zählt noch.
# AUSLEGUNG: forecast läuft am Ende der Bilanz und kündigt das Ereignis für die Natur-Phase der nächsten Runde an;
# der Spieler sieht es während seiner Eingriffe („Vorschau“) und kann reagieren. event tritt nach season ein.
pipeline: [season, event, couplings, healing, forms, levels, life, evolution, score, harmony, breath, forecast]

rules:
  season: {}
  event: {}
  couplings: {}
  healing:
    interval: 2 # alle 2 Runden …
    step: 1 # … bewegt sich jeder Wert um 1 zum Ruhewert
  forms: {}
  levels:
    min: 1
    max: 5
    riseAfter: 3 # Runden am Stück in derselben, nicht verödeten Form
    idealFrom: 4 # Stufe 4 und 5 nur in der Idealform
    species:
      enabled: true
      forRise: 1 # „genügend Arten“ (Platzhalter)
      forTop: 4 # Stufe 5 verlangt ≥ 4 Arten
  life:
    max: 9 # Bestand je Art und Zone 0–9
    food:
      perStat: 2 # 1 Punkt Vegetation/Totholz/Licht … ernährt 2 Tiere
      perPrey: 1 # 1 Beutetier ernährt 1 Räuber
      huntNeighbors: true # Räuber jagen auch in Nachbarzonen
    growth: 1 # satt und in passender Form: +1 (nicht im Winter)
    hunger: 1 # nicht satt: −1
    degradedLoss: 1 # außerhalb des Lebensraums in verödeter Form: −1
    # AUSLEGUNG: Satte Tiere verbrauchen keine Nahrung; erst bei Knappheit wird sie leergefressen (Überweidung).
    # Balancing in Phase 6.
    overuse: # Überweidung: hungrige Tiere fressen einen Wert leer (Effekte auf die Zone)
      vegetation: [{ adjust: vegetation, by: -1 }, { adjust: soil, by: -1 }]
      deadwood: [{ adjust: deadwood, by: -1 }]
    overhunt: 1 # zu viele Räuber: Beute −1
    hunt: 1 # Jäger (Mensch) senken jeden gejagten Bestand ihrer Zone um 1
    migration: { from: 4, amount: 1 } # ab Bestand 4 wandert 1 Tier in eine passende Nachbarzone
  evolution:
    minAncestor: 5 # Bestand des Vorfahren in der Zone
    rounds: 3 # Runden in Folge
    amount: 2 # so viele Tiere wechseln zur neuen Art
    levelGap: 2 # Zonenstufe ≥ Stufe der Art − 2
    pressure: # Selektionsdruck ab Stufe 4: Störung in Zone oder Nachbarzone in den letzten 4 Runden
      fromTier: 4
      when: [{ any: [{ disturbedWithin: 4 }, { anyNeighbor: [{ disturbedWithin: 4 }] }] }]
    startGifts: true # AUSLEGUNG: Gaben des Startlebens kommen zu Spielbeginn ins Deck
  score:
    humanFactor: 2 # solange Menschen leben, zählt jede Runde doppelt
  harmony: {}
  breath:
    start: 3 # AUSLEGUNG: Startodem = Zufluss bei Start-Harmonie (1 + ⌊60/25⌋)
    base: 1
    harmonyStep: 25 # + ⌊Harmonie / 25⌋
    speciesBonus: 1 # + 1 …
    speciesBonusFrom: 6 # … wenn ≥ 6 Arten leben
    max: 10 # Obergrenze angespart
  forecast: # Ereignisse (Konzept 9): mit jedem Jahr wahrscheinlicher und stärker (Platzhalter)
    chance: { base: 0.3, perYear: 0.1, max: 0.9 } # Wahrscheinlichkeit je Runde, dass ein Ereignis angekündigt wird
    strength: { base: 1, perYear: 0.25, max: 3 } # Faktor auf adjust/population-Effekte (gerundet, mind. 1)

# Startdeck (8–10 Karten)
starterDeck: [thunderstorm, drought, storm, frost, rain, sun, seeds, fertilizer, healing]

# Textbausteine für erzeugte Texte (Kartentext). Platzhalter in {Klammern}.
