  effect.draw: { de: 'ziehe {n} Karten', en: 'draw {n} cards' }
  effect.breath: { de: 'Odem {n}', en: 'Breath {n}' }
  effect.population: { de: 'Bestand {species} {n}', en: '{species} population {n}' }
