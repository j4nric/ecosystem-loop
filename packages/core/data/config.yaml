  effect.restoreAllSteps: { de: 'alle Werte {n} Schritt zum Ruhewert', en: 'all values {n} step towards rest' }
  effect.restoreStat: { de: '{stat} zurück zum Ruhewert', en: '{stat} back to rest' }
  effect.restoreStatSteps: { de: '{stat} {n} Schritt zum Ruhewert', en: '{stat} {n} step towards rest' }
