# Kopplungen zwischen Nachbarzonen (Konzept 4.3). Laufen jede Runde nach Jahreszeit (und später Ereignis).
# from: Quellzonen (Geografie + Bedingungen), to: Nachbarn der Quelle (optional nur eine Geografie).
# Effekte wirken auf das Ziel (self); die Quelle heißt "source".

couplings:
  - id: snowmelt
    name: { de: Schneeschmelze, en: Snowmelt }
    seasons: [spring]
    from: { geography: mountains, when: [{ stat: snow, gte: 1 }] }
    to: { geography: river }
    effects:
      # Bis zu 1 Schnee wandert als Wasserstand in den Fluss (Platzhalter).
      - { transfer: snow, into: water, amount: 1, from: source }

  - id: freshwater
    name: { de: Süßwasser, en: Fresh water }
    from: { geography: river, when: [{ stat: water, gte: 3 }] }
    to: { geography: coast }
    effects: [{ adjust: salt, by: -1 }]

  - id: forest_climate
    name: { de: Waldklima, en: Forest climate }
    from: { geography: forest, when: [{ stat: vegetation, gte: 4 }] }
    to: { geography: plains }
    effects: [{ adjust: moisture, by: 1 }]

  - id: flooding
    name: { de: Hochwasser, en: Flooding }
    from: { geography: river, when: [{ stat: water, eq: 5 }] }
    effects: [{ adjust: moisture, by: 1 }, { adjust: vegetation, by: -1 }]
