# Jahreszeiten (Konzept 9). Eine Runde ist eine Jahreszeit, vier Runden sind ein Jahr.
# rules: Effekte auf alle Zonen (optional nur bestimmte Geografien und mit Bedingungen).
# Effekte auf Werte, die eine Zone nicht hat, verpuffen.

start: spring

seasons:
  - id: spring
    name: { de: Frühling, en: Spring }
    rules:
      - when: [{ stat: moisture, gte: 2 }]
        effects: [{ adjust: vegetation, by: 1 }]
    # Schneeschmelze: siehe couplings.yaml (snowmelt, nur im Frühling)

  - id: summer
    name: { de: Sommer, en: Summer }
    rules:
      - effects: [{ adjust: moisture, by: -1 }]

  - id: autumn
    name: { de: Herbst, en: Autumn }
    rules:
      # AUSLEGUNG: „Totholz +1, Vegetation −1 im Wald“ – beides nur im Wald (Totholz gibt es nur dort).
      - geographies: [forest]
        effects: [{ adjust: deadwood, by: 1 }, { adjust: vegetation, by: -1 }]

  - id: winter
    name: { de: Winter, en: Winter }
    pausesGrowth: true
    rules:
      - effects: [{ adjust: snow, by: 1 }]
