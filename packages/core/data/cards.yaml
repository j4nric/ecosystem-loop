# Karten sind Eingriffe des Gottes (Konzept 6.2). Kosten in Odem, Zahlen sind Platzhalter.
#
# slots     – was der Spieler wählt: zone | neighbor (of: früherer Slot). Optional "when": Bedingungen an die Zone.
#             species (in: früherer Zonen-Slot) = eine Art, die dort lebt; optional eats/species als Filter.
# effects   – werden der Reihe nach angewendet. Ziel "at" = Slot-Id, scope: self | neighbors | area | all.
#             Effekte auf Werte, die eine Zone nicht hat, verpuffen.
# triggers  – Schwellen: "when" wird VOR dem Grundeffekt geprüft (check: before), mit check: after danach.
#             disturbance: true = die Folge ist eine Störung der Zone (Zonenstufe, Harmonie, Selektionsdruck).
# reach     – zone (Standard): wirkt auf die gewählten Slots. world: ohne Zielwahl auf alle Zonen (Wetter,
#             Naturkräfte). Weltkarten haben keine Zonen-/Art-Slots (choice erlaubt); die Zone heißt "self"
#             (at weglassen). effects wirken in jeder Zone, byGeography.<geografie> zusätzlich nur dort;
#             Schwellen gelten je Zone. Ausstrahlungen (scope ≠ self) nur mit adjust, population, disturb.
# Der Kartentext wird aus Effekten und Schwellen erzeugt.

categories:
  - { id: weather, name: { de: Wetter, en: Weather } }
  - { id: gift, name: { de: Gabe, en: Gift } }
  - { id: miracle, name: { de: Wunder, en: Miracle } }
  - { id: species, name: { de: Gabe der Arten, en: Gift of the species } }
  - { id: human, name: { de: Menschenkarte, en: Human card } }

cards:
  # ---------- Wetter (Weltkarten, Konzept 6.2 Variante C) ----------
  # Wetter wirkt ohne Zielwahl auf alle Zonen, jede Geografie reagiert anders. Jeder Wetterzug ist ein Tausch:
  # Die Idealformen wollen Verschiedenes (Wald und Küste viel Feuchte, Flachland höchstens 3, Berge wenig Schnee,
  # Fluss Wasserstand genau 3), also hilft dieselbe Karte in einer Zone und schadet in einer anderen.
  # Naturgewalten (Gewitter, Dürre, Sturm, Frost) kosten 0 Odem und tragen Schwellen (Risiko);
  # Wettergaben (Regen, Trockenwind, Sonne, Schneefall) kosten 1–2 Odem.
  # Schwellen gelten je Zone und sind mit geography-Bedingungen auf die Lagen begrenzt, in denen sie
  # thematisch passen, damit eine Karte nicht überall zugleich eine Katastrophe auslöst.

  # Gewitter: Starkregen überall (Feuchte +2), der Fluss schwillt an. Blitz entzündet trockenes Land
  # (nur Wald und Flachland: dort gibt es Brennstoff); Sturzflut nur in Bergen (Mure) und Flachland
  # (Überschwemmung), nicht am Fluss, der sonst schon im Ruhezustand bei jedem Gewitter überliefe.
  # Hilft Wald und Küste (Urwald, Mangrove brauchen Feuchte ≥ 4), schadet dem Flachland (Moor statt Wiese).
  - id: thunderstorm
    name: { de: Gewitter, en: Thunderstorm }
    category: weather
    cost: 0
    reach: world
    effects:
      - { adjust: moisture, by: 2 }
    byGeography:
      river: [{ adjust: water, by: 1 }]
    triggers:
      - id: fire
        name: { de: Feuer, en: Fire }
        icon: '🔥'
        when:
          - { any: [{ geography: forest }, { geography: plains }] }
          - { stat: moisture, lte: 1 }
          - { stat: vegetation, gte: 1 }
        disturbance: true
        effects:
          - { set: vegetation, value: 0 }
          - { adjust: deadwood, by: 3 } # nur im Wald; im Flachland verpufft es
      - id: deluge
        name: { de: Flut, en: Deluge }
        icon: '🌊'
        when:
          - { any: [{ geography: mountains }, { geography: plains }] }
          - { stat: moisture, gte: 4 }
        disturbance: true
        effects:
          - { adjust: vegetation, by: -1 }
          - { adjust: moisture, by: 1, scope: neighbors }

  # Dürre: überall Feuchte −1; ohne Niederschlag schwindet der Schnee der Berge, der Fluss sinkt, im Wald stirbt
  # Holz ab, an der Küste verdunstet Wasser und das Salz bleibt. Welke, wo die Feuchte danach auf 0 fällt.
  # Hilft verschneiten Bergen, nassem Flachland (Feuchte ≤ 3 für die Blumenwiese) und einem Hochwasser-Fluss;
  # schadet Wald und Küste.
  - id: drought
    name: { de: Dürre, en: Drought }
    category: weather
    cost: 0
    reach: world
    effects:
      - { adjust: moisture, by: -1 }
    byGeography:
      mountains: [{ adjust: snow, by: -1 }]
      forest: [{ adjust: deadwood, by: 1 }]
      river: [{ adjust: water, by: -1 }]
      coast: [{ adjust: salt, by: 1 }]
    triggers:
      - id: wilting
        name: { de: Welke, en: Wilting }
        icon: '🥀'
        check: after
        when: [{ stat: moisture, eq: 0 }]
        effects:
          - { adjust: vegetation, by: -1 }

  # Sturm: Bäume brechen im Wald (Vegetation −1, Totholz +1), Gischt trägt Salz an die Küste, der Wind
  # verweht den Schnee der Berge. Baumsturz nur, wo dichter Wald steht (Wald, Bergwald): Lichtung und Totholz.
  # Hilft verschneiten Bergen (Alm braucht Schnee 1–2) und einem zu dünnen Totholz-Wald; schadet Urwald und Mangrove.
  - id: storm
    name: { de: Sturm, en: Storm }
    category: weather
    cost: 0
    reach: world
    byGeography:
      mountains: [{ adjust: snow, by: -1 }]
      forest: [{ adjust: vegetation, by: -1 }, { adjust: deadwood, by: 1 }]
      coast: [{ adjust: salt, by: 1 }]
    triggers:
      - id: windthrow
        name: { de: Baumsturz, en: Windthrow }
        icon: '🌲'
        when:
          - { any: [{ geography: forest }, { geography: mountains }] }
          - { stat: vegetation, gte: 5 }
        disturbance: true
        effects:
          - { adjust: light, by: 2 }
          - { adjust: deadwood, by: 1 } # nur im Wald; im Bergwald verpufft es

  # Frost: in den Bergen fällt Schnee; im Flachland erfriert die Wiese (Vegetation −1), aber der Frost lockert
  # den Boden (Frostgare, Boden +1); Eis bindet Flusswasser (Wasserstand −1). Eisbruch nur im nassen Wald:
  # Äste brechen unter der Eislast.
  # Hilft dem Boden des Flachlands, einem Hochwasser-Fluss und schneearmen Bergen (Geröll); schadet Alm und Aue.
  - id: frost
    name: { de: Frost, en: Frost }
    category: weather
    cost: 0
    reach: world
    byGeography:
      mountains: [{ adjust: snow, by: 1 }]
      plains: [{ adjust: vegetation, by: -1 }, { adjust: soil, by: 1 }]
      river: [{ adjust: water, by: -1 }]
    triggers:
      - id: ice_break
        name: { de: Eisbruch, en: Ice break }
        icon: '🧊'
        when: [{ geography: forest }, { stat: moisture, gte: 4 }]
        effects:
          - { adjust: vegetation, by: -1 }
          - { adjust: deadwood, by: 1 }

  # Regen: Berge Schnee, Wald und Flachland Feuchte, Fluss Wasserstand, Küste wird ausgesüßt.
  # Hilft Wald, Küste und einem niedrigen Fluss; schadet nassem Flachland und verschneiten Bergen.
  - id: rain
    name: { de: Regen, en: Rain }
    category: weather
    cost: 1
    reach: world
    byGeography:
      mountains: [{ adjust: snow, by: 1 }]
      forest: [{ adjust: moisture, by: 1 }]
      plains: [{ adjust: moisture, by: 1 }]
      river: [{ adjust: water, by: 1 }]
      coast: [{ adjust: salt, by: -1 }]

  # Trockenwind: überall Feuchte −1; als Föhn taut er in den Bergen Schnee weg.
  # Hilft nassem Flachland (Moor) und verschneiten Bergen; schadet Wald und Küste.
  - id: dry_wind
    name: { de: Trockenwind, en: Dry wind }
    category: weather
    cost: 1
    reach: world
    effects: [{ adjust: moisture, by: -1 }]
    byGeography:
      mountains: [{ adjust: snow, by: -1 }]

  # Sonne: überall Licht +1; Schneeschmelze in den Bergen (Schnee −1), an der Küste verdunstet Wasser (Salz +1).
  # Die Karte, die Schnee senkt. Hilft Alm und Blumenwiese (Licht ≥ 3), schadet der Mangrove (Salz 2–3).
  - id: sun
    name: { de: Sonne, en: Sun }
    category: weather
    cost: 1
    reach: world
    effects: [{ adjust: light, by: 1 }]
    byGeography:
      mountains: [{ adjust: snow, by: -1 }]
      coast: [{ adjust: salt, by: 1 }]

  # Schneefall: dichte Wolken überall (Licht −1), Schnee in den Bergen, im Wald schmilzt die Schneedecke
  # langsam ins Unterholz (Feuchte +1). Hilft schneearmen Bergen und dem Wald; schadet Riff und Alm (Licht).
  - id: snowfall
    name: { de: Schneefall, en: Snowfall }
    category: weather
    cost: 2
    reach: world
    effects: [{ adjust: light, by: -1 }]
    byGeography:
      mountains: [{ adjust: snow, by: 1 }]
      forest: [{ adjust: moisture, by: 1 }]

  # ---------- Gaben (1–2 Odem, gezielt: ein Wert ±1 auf einer gewählten Zone) ----------
  # Schatten und Quelle bleiben gezielt: Sie sind örtlich (eine Baumgruppe, eine Quelle), kein Wetter.

  - id: shade
    name: { de: Schatten, en: Shade }
    category: gift
    cost: 1
    slots: [{ id: zone, kind: zone }]
    effects: [{ adjust: light, by: -1, at: zone }]

  - id: seeds
    name: { de: Samen, en: Seeds }
    category: gift
    cost: 1
    slots: [{ id: zone, kind: zone }]
    effects: [{ adjust: vegetation, by: 1, at: zone }]

  - id: fertilizer
    name: { de: Dünger, en: Fertiliser }
    category: gift
    cost: 1
    slots: [{ id: zone, kind: zone, when: [{ hasStat: soil }] }]
    effects: [{ adjust: soil, by: 1, at: zone }]

  - id: spring_water
    name: { de: Quelle, en: Spring }
    category: gift
    cost: 2
    slots: [{ id: zone, kind: zone, when: [{ hasStat: water }] }]
    effects: [{ adjust: water, by: 1, at: zone }]

  - id: low_tide
    name: { de: Ebbe, en: Low tide }
    category: gift
    cost: 2
    slots: [{ id: zone, kind: zone, when: [{ hasStat: salt }] }]
    effects: [{ adjust: salt, by: -1, at: zone }]

  - id: leaf_fall
    name: { de: Laubfall, en: Leaf fall }
    category: gift
    cost: 1
    slots: [{ id: zone, kind: zone, when: [{ hasStat: deadwood }] }]
    effects: [{ adjust: deadwood, by: 1, at: zone }]

  # ---------- Wunder (3–5 Odem, Korrektur von Fehlern) ----------
  - id: healing
    name: { de: Heilung, en: Healing }
    category: miracle
    cost: 4
    slots: [{ id: zone, kind: zone }]
    effects: [{ restore: all, at: zone }]

  - id: balance
    name: { de: Ausgleich, en: Balance }
    category: miracle
    cost: 3
    slots: [{ id: zone, kind: zone }]
    effects: [{ restore: all, steps: 1, at: zone, scope: area }]

  - id: inspiration
    name: { de: Eingebung, en: Inspiration }
    category: miracle
    cost: 3
    effects: [{ draw: 2 }]

  - id: blessing
    name: { de: Segen, en: Blessing }
    category: miracle
    cost: 5
    effects: [{ adjust: vegetation, by: 1, scope: all }]

  # Gegenkarten zu Ereignissen (Konzept 6.2, 8, 9); im Pool erst über Meilensteine (meta.yaml).
  - id: silence
    name: { de: Stille, en: Silence }
    category: miracle
    cost: 4 # Balancing 2026-11-10: 3 → 4 (Freischaltung zu stark)
    effects: [{ event: cancel }]

  - id: ark
    name: { de: Arche, en: Ark }
    category: miracle
    cost: 4
    slots:
      - { id: zone, kind: zone }
      - { id: species, kind: species, in: zone, label: { de: Art, en: Species } }
    effects: [{ population: species, by: 2, at: zone }]

  # ---------- Gaben der Arten (kommen ins Deck, wenn die Art erstmals entsteht; Konzept 5.3) ----------
  - id: algal_bloom
    name: { de: Algenblüte, en: Algal bloom }
    category: species
    cost: 1
    slots: [{ id: zone, kind: zone, when: [{ any: [{ hasStat: water }, { hasStat: salt }] }] }]
    effects:
      - { adjust: vegetation, by: 1, at: zone }
      - { adjust: light, by: -1, at: zone }

  - id: decomposition
    name: { de: Zersetzung, en: Decomposition }
    category: species
    cost: 1
    slots:
      - { id: zone, kind: zone, when: [{ hasStat: deadwood }] }
      - { id: target, kind: neighbor, of: zone, when: [{ hasStat: soil }] }
    effects:
      - { adjust: deadwood, by: -1, at: zone }
      - { adjust: soil, by: 1, at: target }

  # AUSLEGUNG: „flussaufwärts oder flussabwärts“ = in eine Nachbarzone mit Wasser (Fluss oder Küste).
  - id: spawning_run
    name: { de: Laichzug, en: Spawning run }
    category: species
    cost: 1
    slots:
      - { id: zone, kind: zone, when: [{ population: fish, gte: 1 }] }
      - id: target
        kind: neighbor
        of: zone
        when: [{ any: [{ hasStat: water }, { hasStat: salt }] }]
        label: { de: Wohin, en: Where to }
    effects:
      - { move: fish, amount: 1, from: zone, at: target }

  - id: pollination
    name: { de: Bestäubung, en: Pollination }
    category: species
    cost: 1
    slots: [{ id: zone, kind: zone }]
    effects: [{ adjust: vegetation, by: 1, at: zone }]

  - id: rain_call
    name: { de: Regenruf, en: Rain call }
    category: species
    cost: 1
    slots: [{ id: zone, kind: zone }]
    effects: [{ adjust: moisture, by: 1, at: zone }]

  - id: sunbathing
    name: { de: Sonnenbad, en: Sunbathing }
    category: species
    cost: 1
    slots: [{ id: zone, kind: zone }]
    effects:
      - { adjust: light, by: 1, at: zone }
      - { adjust: moisture, by: -1, at: zone }

  - id: burrowing
    name: { de: Graben, en: Burrowing }
    category: species
    cost: 1
    slots: [{ id: zone, kind: zone, when: [{ hasStat: soil }] }]
    effects:
      - { adjust: soil, by: 1, at: zone }
      - { adjust: vegetation, by: -1, at: zone }

  - id: seed_flight
    name: { de: Samenflug, en: Seed flight }
    category: species
    cost: 1
    slots: [{ id: zone, kind: zone }]
    effects: [{ adjust: vegetation, by: 1, at: zone }]

  - id: browsing
    name: { de: Äsen, en: Browsing }
    category: species
    cost: 0
    slots: [{ id: zone, kind: zone }]
    effects: [{ adjust: vegetation, by: -1, at: zone }]

  - id: hunt
    name: { de: Jagd, en: Hunt }
    category: species
    cost: 1
    slots:
      - { id: zone, kind: zone }
      # AUSLEGUNG: Pflanzenfresser = Arten, die laut 5.3 Vegetation fressen (Käfer und Mensch zählen nicht).
      - id: prey
        kind: species
        in: zone
        species: [bee, small_mammal, deer, primate]
        label: { de: Pflanzenfresser, en: Herbivore }
    effects: [{ population: prey, by: -2, at: zone }]

  # Späherblick: angekündigtes Ereignis abwenden oder um eine Runde verschieben (Wahl beim Ausspielen).
  - id: scout_eye
    name: { de: Späherblick, en: Scout's eye }
    category: species
    cost: 2
    slots:
      - id: mode
        kind: choice
        label: { de: Späherblick, en: Scout's eye }
        options:
          - { id: avert, label: { de: Abwenden, en: Avert }, effects: [{ event: cancel }] }
          - { id: delay, label: { de: Verschieben, en: Delay }, effects: [{ event: delay, rounds: 1 }] }

  - id: fruit_rain
    name: { de: Fruchtregen, en: Fruit rain }
    category: species
    cost: 2
    slots: [{ id: zone, kind: zone }]
    effects: [{ adjust: vegetation, by: 1, at: zone, scope: neighbors }]

  # ---------- Menschenkarten (0–2 Odem, stark, mit Langzeitkosten; Konzept 5.4) ----------
  # AUSLEGUNG: Feuer = gezielte Brandrodung wie die Feuer-Schwelle des Gewitters (Störung), nur wo etwas wächst.
  - id: fire
    name: { de: Feuer, en: Fire }
    category: human
    cost: 0
    slots: [{ id: zone, kind: zone, when: [{ stat: vegetation, gte: 1 }] }]
    triggers:
      - id: slash_and_burn
        name: { de: Brandrodung, en: Slash and burn }
        icon: '🔥'
        at: zone
        when: [{ stat: vegetation, gte: 1 }]
        disturbance: true
        effects:
          - { set: vegetation, value: 0, at: zone }
          - { adjust: deadwood, by: 3, at: zone }
          - { adjust: soil, by: 1, at: zone }

  # AUSLEGUNG: „Vegetation fest +2“ = Vegetation +2 (sicher, ohne Schwelle); Boden −1 laugt aus.
  - id: farming
    name: { de: Ackerbau, en: Farming }
    category: human
    cost: 1
    slots: [{ id: zone, kind: zone, when: [{ hasStat: soil }] }]
    effects:
      - { adjust: soil, by: -1, at: zone }
      - { adjust: vegetation, by: 2, at: zone }

  - id: settlement
    name: { de: Siedlung, en: Settlement }
    category: human
    cost: 2
    slots: [{ id: zone, kind: zone, when: [{ population: human, gte: 1 }] }]
    effects: [{ population: human, by: 2, at: zone }]
