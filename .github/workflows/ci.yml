name: CI

on:
  pull_request:
  # Auf main ruft der Deploy-Workflow diese CI auf und liefert genau ihren Build aus.
  workflow_call:
  workflow_dispatch:

# Neuere Pushes auf denselben Branch brechen ältere Läufe ab.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Format, Lint, Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  test:
    name: Tests + Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:coverage

  game-data:
    name: Spieldaten + Simulation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Spieldaten validieren
        run: npm run validate
      - name: Absturz-Test (Zufalls-Bot, alle Szenarien)
        run: npm run sim -- --bot random --runs 20 --scenario random
      - name: Absturz-Test (gieriger Bot)
        run: npm run sim -- --bot greedy --runs 3 --scenario random

  web:
    name: Web-App bauen
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build für den Deploy aufbewahren
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
      - name: Caddyfile des Deploys prüfen
        run: docker run --rm -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: docker-compose des Deploys prüfen
        run: docker compose -f deploy/docker-compose.yml config -q

  audit:
    name: Abhängigkeiten (Sicherheit)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Bekannte Sicherheitslücken (high/critical) in Laufzeit-Abhängigkeiten
        run: npm audit --omit=dev --audit-level=high

  # Ein einzelner Pflicht-Check für den Branch-Schutz.
  ci-ok:
    name: CI ok
    if: always()
    needs: [quality, test, game-data, web, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Alle Jobs erfolgreich?
        run: |
          echo '${{ toJSON(needs) }}'
          [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false" ]
