name: Deploy Web-App

# Jeder Push auf main: CI läuft (ci.yml per workflow_call), danach geht genau der dort
# gebaute und getestete Stand auf den vServer. Muster wie Stammtisch (j4nric/skat-roguelite):
# statische Dateien per rsync nach $DEPLOY_PATH/site, Caddy-Container hinter dem Caddy der
# Haushalt-App. Ohne Secrets wird der Server-Schritt übersprungen. Anleitung: deploy/README.md.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Auf den vServer
    runs-on: ubuntu-latest
    needs: ci
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: site
      - name: Build-Info anlegen
        run: |
          printf '{"commit":"%s","built":"%s"}\n' "$GITHUB_SHA" "$(date -u +%FT%TZ)" > site/version.json
          ls -la site
      - name: Secrets vorhanden?
        id: secrets
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ] || [ -z "$DEST" ]; then
            echo "::warning::Deploy-Secrets fehlen (DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH). Server-Schritt übersprungen. Siehe deploy/README.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      # Mit DEPLOY_KNOWN_HOSTS (Host-Schlüssel des Servers) wird streng geprüft; ohne wird
      # der Schlüssel aus ssh-keyscan übernommen (mit Warnung).
      - name: SSH einrichten
        if: steps.secrets.outputs.ready == 'true'
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$KNOWN_HOSTS" ]; then
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::DEPLOY_KNOWN_HOSTS fehlt; Host-Schlüssel aus ssh-keyscan übernommen. Siehe deploy/README.md."
            ssh-keyscan -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi
          chmod 600 ~/.ssh/known_hosts
          {
            echo "Host $HOST"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
      - name: Dateien übertragen
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh "$USER@$HOST" "mkdir -p '$DEST/site'"
          # Neue Dateien landen unter vorläufigen Namen und werden am Ende gemeinsam
          # umbenannt, alte erst danach gelöscht: niemand sieht einen halben Build.
          rsync -az --delete-after --delay-updates site/ "$USER@$HOST:$DEST/site/"
          rsync -az deploy/docker-compose.yml deploy/Caddyfile deploy/site.caddy deploy/up.sh "$USER@$HOST:$DEST/"
      - name: Container starten oder aktualisieren
        if: steps.secrets.outputs.ready == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          DEST: ${{ secrets.DEPLOY_PATH }}
        run: ssh "$USER@$HOST" "sh '$DEST/up.sh'"
      - name: Erreichbarkeit prüfen
        if: steps.secrets.outputs.ready == 'true' && vars.DEPLOY_URL != ''
        env:
          URL: ${{ vars.DEPLOY_URL }}
        # Beim allerersten Abruf holt der Haushalt-Caddy das Zertifikat bei Let's Encrypt;
        # bis dahin antwortet er mit „tlsv1 alert internal error“. Deshalb bis zu 3 Minuten warten.
        run: |
          for i in $(seq 1 18); do
            if curl -fsS --max-time 10 "$URL/version.json" 2>/tmp/curl.err | grep -q "$GITHUB_SHA"; then
              echo "Live: $URL"
              exit 0
            fi
            sleep 10
          done
          echo "Letzte Antwort: $(cat /tmp/curl.err)"
          if grep -q "alert internal error" /tmp/curl.err; then
            echo "::error::Der Haushalt-Caddy hat kein Zertifikat für $URL. Ist der Block für die Domain im Repo j4nric/haushalt-app ausgerollt? Siehe deploy/README.md, Fehlersuche."
          else
            echo "::error::$URL liefert nicht den neuen Stand aus. Siehe deploy/README.md, Fehlersuche."
          fi
          exit 1
