# Zonentypen und die Karte des Waldes.

zoneTypes:
  - id: riverbank
    name: { de: Ufer }
  - id: clearing
    name: { de: Lichtung }
  - id: thicket
    name: { de: Dickicht }
  - id: canopy
    name: { de: Kronendach }
  - id: swamp
    name: { de: Sumpf }
    transitions:
      # Einzige bisher definierte Kippung (Handover). Weitere: offene Frage.
      - to: clearing
        when: [{ stat: moisture, eq: 0 }]

# Zonen haben eine feste Kennung (a–e), ihr Typ kann wechseln.
map:
  zones:
    - id: a
      type: riverbank
      values: { light: 3, moisture: 4, density: 2, deadwood: 1 }
      neighbors: [b, e]
    - id: b
      type: clearing
      values: { light: 4, moisture: 2, density: 1, deadwood: 1 }
      neighbors: [a, c, d]
    - id: c
      type: thicket
      values: { light: 1, moisture: 3, density: 4, deadwood: 2 }
      neighbors: [b, d]
    - id: d
      type: canopy
      values: { light: 2, moisture: 3, density: 5, deadwood: 1 }
      neighbors: [b, c, e]
    - id: e
      type: swamp
      values: { light: 2, moisture: 5, density: 2, deadwood: 3 }
      neighbors: [a, d]
