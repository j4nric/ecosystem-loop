# Läuft auf dem vServer in $DEPLOY_PATH (/opt/being-god). Der Deploy-Job
# (.github/workflows/deploy.yml) synchronisiert ./site, diese Datei, die Caddyfile
# und up.sh dorthin und führt up.sh aus.
#
# Ports 80/443 gehören dem Caddy der Haushalt-App (Repo j4nric/haushalt-app,
# infra/production). Dieser Caddy beendet HTTPS für unsere Domain (Eintrag
# deploy/site.caddy, den up.sh ihm übergibt) und leitet über das gemeinsame Netzwerk
# `edge` (und bis zu seinem Umzug noch `beinggod-proxy`) an den Alias `beinggod-web`
# weiter. Dieser Container veröffentlicht keine Ports – dasselbe Muster wie
# Stammtisch (skat-roguelite) und Uhrturm (auto-battle). Siehe deploy/README.md.

name: being-god

# Logs rotieren: höchstens 3 Dateien zu 10 MB.
x-logging: &logging
  driver: local
  options:
    max-size: 10m
    max-file: '3'

services:
  web:
    image: caddy:2.11-alpine
    restart: unless-stopped
    logging: *logging
    volumes:
      - ./site:/srv:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      proxy:
        aliases: [beinggod-web]
      # Gemeinsames Netz des vorderen Caddy; `proxy` bleibt, bis der Haushalt-Caddy
      # umgezogen ist. Aliase müssen in `edge` eindeutig sein.
      edge:
        aliases: [beinggod-web]

networks:
  proxy:
    name: beinggod-proxy
    external: true
  edge:
    name: edge
    external: true
